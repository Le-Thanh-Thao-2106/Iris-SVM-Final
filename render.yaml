services:
  - type: web
    name: iris-svm-node-api
    runtime: node
    rootDir: backend/node-api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SVM_API_HOST
        fromService:
          type: web
          name: iris-svm-python-api
          property: hostport

  - type: web
    name: iris-svm-python-api
    runtime: python
    rootDir: backend/python-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: iris-svm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://iris-svm-node-api.onrender.com
